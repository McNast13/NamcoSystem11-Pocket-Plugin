[package]
name = "namco-system11-games"
version = "0.1.0"
edition = "2021"
description = "Pocket Sync / pupdate plugin: installs the games for the Namco System 11 core from your own MAME zips"
publish = false

[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
crc32fast = "1"
md-5 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
